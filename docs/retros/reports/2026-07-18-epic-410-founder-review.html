    &lt;article id=&quot;candidate-comparison&quot; data-annotatable data-anchor-label=&quot;Candidate comparison&quot;&gt;
      &lt;h3&gt;1.4 What the candidates proved&lt;/h3&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;
        &lt;table aria-label=&quot;Candidate comparison&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Candidate&lt;/th&gt;&lt;th&gt;What improved&lt;/th&gt;&lt;th&gt;What failed or stayed unknown&lt;/th&gt;&lt;th&gt;Decision&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Candidate&quot;&gt;#403 strict residency&lt;/td&gt;
              &lt;td data-label=&quot;Improved&quot;&gt;Ordinary pan DOM peak 131→80; fast pan 131→72; pooled p95 frame interval −20%; long tasks 510→400.&lt;/td&gt;
              &lt;td data-label=&quot;Risk&quot;&gt;Rare far-jump duration +57.4%, missed frames +76%; heap growth +26.7%; 540-Card ceiling unexercised.&lt;/td&gt;
              &lt;td data-label=&quot;Decision&quot;&gt;&lt;strong&gt;Selected basis&lt;/strong&gt;, softened with buffer, look-ahead, hysteresis, safety, and Live pins.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Candidate&quot;&gt;#404 content visibility&lt;/td&gt;
              &lt;td data-label=&quot;Improved&quot;&gt;Could let the browser skip some layout/paint work while retaining DOM.&lt;/td&gt;
              &lt;td data-label=&quot;Risk&quot;&gt;Note/Result/follow-up scroll drift, transcript drift, and one-click first-intent retargeting.&lt;/td&gt;
              &lt;td data-label=&quot;Decision&quot;&gt;&lt;strong&gt;Rejected.&lt;/strong&gt; Correctness vetoes timing benefit.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Candidate&quot;&gt;#405 cached passive pixels&lt;/td&gt;
              &lt;td data-label=&quot;Improved&quot;&gt;Bounded passive cache, capture suppression, Live promotion, and structural residency model.&lt;/td&gt;
              &lt;td data-label=&quot;Risk&quot;&gt;Cannot preserve trusted events, exact selection/copy, keyboard traversal, links, accessibility tree, or Browser Find before activation.&lt;/td&gt;
              &lt;td data-label=&quot;Decision&quot;&gt;&lt;strong&gt;Rejected.&lt;/strong&gt; Pixels are not a semantic DOM replacement.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Candidate&quot;&gt;#413 image renditions&lt;/td&gt;
              &lt;td data-label=&quot;Improved&quot;&gt;Peak decoded residency 7.34 MiB; derived ~0.01 MiB; 52 eviction/revocation events; saved references unchanged.&lt;/td&gt;
              &lt;td data-label=&quot;Risk&quot;&gt;Motion deferral, native decoder/GPU, low-power devices, focus order, and real assistive technology unmeasured.&lt;/td&gt;
              &lt;td data-label=&quot;Decision&quot;&gt;&lt;strong&gt;Selected companion image policy&lt;/strong&gt;, not a renderer.&lt;/td&gt;
            &lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;div class=&quot;callout&quot;&gt;
        &lt;strong&gt;Why “rejected” is useful work:&lt;/strong&gt; #404 and #405 exposed product losses that a timing-only
        benchmark could have hidden. Their evidence prevented Eido from becoming faster by silently becoming
        less searchable, less clickable, or less accessible.
      &lt;/div&gt;
    &lt;/article&gt;

          &lt;text x=&quot;365&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;V · visible&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;365&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;what camera sees&lt;/text&gt;
          &lt;path class=&quot;edge&quot; marker-end=&quot;url(#arrow-arch)&quot; d=&quot;M210 210 C245 190 255 125 285 112&quot; /&gt;

      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Formal contract&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;&lt;code&gt;V ⊆ P&lt;/code&gt;: everything visible is prepared.&lt;/li&gt;
            &lt;li&gt;Ordinary rich DOM is &lt;code&gt;P ∪ L&lt;/code&gt;.&lt;/li&gt;
            &lt;li&gt;&lt;code&gt;E ⊆ L&lt;/code&gt;: editing implies Live ownership.&lt;/li&gt;
            &lt;li&gt;&lt;code&gt;G&lt;/code&gt; is separate and bounded to 0–2 proxies.&lt;/li&gt;
            &lt;li&gt;&lt;code&gt;S&lt;/code&gt; covers the Board independently.&lt;/li&gt;
            &lt;li&gt;Live pins win over ordinary residency eviction.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Product meaning&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;Nearby detail is ready before it becomes visible.&lt;/li&gt;
            &lt;li&gt;Cards do not flicker at the viewport edge.&lt;/li&gt;
            &lt;li&gt;Focused/selected/editing/scrolling/media Cards stay alive.&lt;/li&gt;
            &lt;li&gt;Hover or focus begins activation before click.&lt;/li&gt;
            &lt;li&gt;If activation loses the race, first intent still arrives exactly once.&lt;/li&gt;
            &lt;li&gt;Far jumps degrade to lightweight Cards, not white space.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article id=&quot;frozen-contracts&quot; data-annotatable data-anchor-label=&quot;Frozen product contracts&quot;&gt;
      &lt;h3&gt;1.6 Product behavior that remains frozen&lt;/h3&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;
        &lt;table aria-label=&quot;Frozen LOD and interaction contracts&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Contract&lt;/th&gt;&lt;th&gt;Exact value or rule&lt;/th&gt;&lt;th&gt;Why it matters&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Reading threshold&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;&lt;code&gt;0.325&lt;/code&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Close Cards keep full current fidelity.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Map threshold&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;&lt;code&gt;≤ 0.15&lt;/code&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Far view remains deliberately lightweight.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Crossfade half-width&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;&lt;code&gt;0.15&lt;/code&gt; multiplicative&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Transitions stay gradual and complementary.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Reading↔Overview&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;&lt;code&gt;0.27625–0.37375&lt;/code&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;No abrupt disappearance near Reading.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Overview↔Map&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;&lt;code&gt;0.1275–0.1725&lt;/code&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Structural view remains continuous.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Deadband&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;Reading holds to &lt;code&gt;≤0.27625&lt;/code&gt;; Map holds to &lt;code&gt;≥0.1725&lt;/code&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Prevents band thrash.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Occupancy demotion&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;&lt;code&gt;&amp;gt;540&lt;/code&gt; visible Cards or &lt;code&gt;&amp;gt;300,000&lt;/code&gt; text weight&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Reading opacity drops safely on extreme density.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Interaction&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;Painted membership equals hit-test membership&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;No invisible/stale targets.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Contract&quot;&gt;Authority&lt;/td&gt;&lt;td data-label=&quot;Rule&quot;&gt;One saved graph; scenes and caches derived&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;No second source of truth.&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article id=&quot;cold-data-result&quot; data-annotatable data-anchor-label=&quot;Cold-data ROI decision&quot;&gt;
      &lt;h3&gt;1.7 Cold-data decision: keep eager SavedBoard&lt;/h3&gt;
      &lt;p&gt;
        The combined synthetic fixture grew to &lt;strong&gt;738,604 bytes&lt;/strong&gt;, a
        &lt;strong&gt;423,400-byte&lt;/strong&gt; increase over control. Yet stable camera navigation made
        &lt;strong&gt;zero cold-record/Card-metric visits&lt;/strong&gt;. Versions and provenance cost bytes, but they were
        not the Reading-navigation bottleneck.
      &lt;/p&gt;
      &lt;div class=&quot;callout decision&quot;&gt;
        &lt;strong&gt;Decision:&lt;/strong&gt; keep the synchronous, source-complete &lt;code&gt;SavedBoard&lt;/code&gt;.
        A lazy record resolver would add lifecycle and correctness risk across save, duplicate, export, playback,
        provenance, search, and execution without improving the selected camera path.
      &lt;/div&gt;
    &lt;/article&gt;

  &lt;section id=&quot;area-teach&quot; data-annotatable data-anchor-label=&quot;Area 2 — Technical teaching&quot;&gt;
    &lt;h2&gt;Area 2 — Technical teaching, without assuming an engineering background&lt;/h2&gt;
    &lt;p class=&quot;area-intro&quot;&gt;
      This area explains what the selected architecture actually does, why the rejected approaches were
      tempting, and how to reason about images, interaction, and evidence.
    &lt;/p&gt;
    &lt;div class=&quot;callout decision&quot;&gt;
      &lt;strong&gt;Technical story in one minute:&lt;/strong&gt; keep a lightweight Board-wide scene so navigation is never
      blank; prepare rich DOM Cards just beyond the visible window; pin Cards that own live interaction; activate
      before click and replay the first intent if necessary; treat image storage, decode, residency, paint, and
      cache growth as separate costs.
    &lt;/div&gt;

    &lt;article id=&quot;glossary&quot; data-annotatable data-anchor-label=&quot;Plain-language glossary&quot;&gt;
      &lt;h3&gt;2.1 Plain-language glossary&lt;/h3&gt;
      &lt;details&gt;
        &lt;summary&gt;Open the glossary when a term is unfamiliar&lt;/summary&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;
        &lt;table aria-label=&quot;Technical glossary&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;Plain language&lt;/th&gt;&lt;th&gt;Why it matters here&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;DOM&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;The browser’s live, semantic page objects.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Best for text, links, selection, inputs, focus, and accessibility—but expensive in large quantities.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Canvas representation&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A lightweight drawn picture/shape.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Cheap and continuous across the whole Board, but not a substitute for live text semantics.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Board Scene&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A derived, pointer-cold description of what the Board should paint.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;The correct high-level seam for visibility/residency policy.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Viewport (V)&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;The part of the Board the camera currently sees.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Visibility is not the same as residency or interaction ownership.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Prepared set (P)&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Visible Cards plus a buffered, directional, recently visited neighborhood.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Avoids blank edges and mount/unmount thrash.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Live owners (L)&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Cards that currently own focus, selection, editing, scroll, gesture, or media.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;They must remain fully interactive even if the camera moves away.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Hot proxies (G)&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;At most two temporary drag/resize/connect handles.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Direct manipulation stays bounded without mounting every Card.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Safety layer (S)&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;The lightweight Board-wide representation that is always available.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Fast or rare jumps show simplified Cards, never blank white regions.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Hysteresis/deadband&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A small “do not immediately reverse” zone.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Prevents flicker and repeated work near a boundary.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Rendition&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A disposable, purpose-sized display copy of a master image.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;Reduces decoded memory and paint cost without changing saved authority.&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;Exact-head CI&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Required proof tied to the exact PR commit.&lt;/td&gt;&lt;td data-label=&quot;Why&quot;&gt;A green result on an earlier commit cannot authorize a changed branch.&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;/details&gt;
    &lt;/article&gt;

    &lt;article id=&quot;dom-versus-canvas&quot; data-annotatable data-anchor-label=&quot;DOM versus canvas&quot;&gt;
      &lt;h3&gt;2.2 Why not just draw everything as pixels?&lt;/h3&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Rich DOM Card&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;Text can be searched and selected.&lt;/li&gt;
            &lt;li&gt;Copy, links, inputs, focus, keyboard, and accessibility use browser-native behavior.&lt;/li&gt;
            &lt;li&gt;Long content can scroll and remain interactive.&lt;/li&gt;
            &lt;li&gt;Cost: many offscreen rich Cards can burden React, layout, paint, and memory.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Lightweight drawn Card&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;Cheap to keep available across a huge Board.&lt;/li&gt;
            &lt;li&gt;Excellent for overview, map, motion safety, and broad shape.&lt;/li&gt;
            &lt;li&gt;Cost: pixels do not carry the full semantics of native text and controls.&lt;/li&gt;
            &lt;li&gt;Best role: safety/overview layer, not a universal live-content replacement.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;callout&quot;&gt;
        The selected architecture does not choose one medium for every job. It uses lightweight drawing for
        continuity and spatial shape, and rich DOM only where detail or interaction has present value.
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article id=&quot;never-blank&quot; data-annotatable data-anchor-label=&quot;Never-blank navigation&quot;&gt;
      &lt;h3&gt;2.3 How never-blank navigation works&lt;/h3&gt;
      &lt;ol class=&quot;compact-list&quot;&gt;
        &lt;li&gt;&lt;strong&gt;S is already there.&lt;/strong&gt; Every Board region has a lightweight representation.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;P leads the camera.&lt;/strong&gt; A buffer and movement-direction look-ahead prepare likely next Cards.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Hysteresis retains recent Cards.&lt;/strong&gt; A Card does not disappear the instant it crosses an edge.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;L overrides eviction.&lt;/strong&gt; A focused, editing, selected, scrolling, gesturing, or media-owning Card stays live.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Rare far jump:&lt;/strong&gt; S appears immediately; detailed Cards join as they become ready.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p&gt;
        This is the same reason a map app shows lower-detail tiles while sharper tiles arrive: continuity is
        more important than pretending every destination was pre-rendered.
      &lt;/p&gt;
    &lt;/article&gt;

    &lt;article id=&quot;first-intent&quot; data-annotatable data-anchor-label=&quot;First intent and activation&quot;&gt;
      &lt;h3&gt;2.4 Why “the first click works” is harder than it sounds&lt;/h3&gt;
      &lt;p&gt;
        A Card may be lightweight just before interaction. Hover or focus begins activation early, but a very
        fast click can still win that race. The system must deliver the intended action exactly once—not drop it,
        and not replay it twice.
      &lt;/p&gt;
      &lt;div class=&quot;diagram&quot;&gt;
        &lt;svg viewBox=&quot;0 0 1000 300&quot; role=&quot;img&quot; aria-labelledby=&quot;intent-title intent-desc&quot;&gt;
          &lt;title id=&quot;intent-title&quot;&gt;First-intent activation flow&lt;/title&gt;
          &lt;desc id=&quot;intent-desc&quot;&gt;Hover or focus prepares the Card. A click either reaches the ready control or is queued through an equivalent single-click path exactly once.&lt;/desc&gt;
          &lt;defs&gt;
            &lt;marker id=&quot;arrow-intent&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;&gt;
              &lt;path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;var(--muted-foreground)&quot; /&gt;
            &lt;/marker&gt;
          &lt;/defs&gt;
          &lt;rect class=&quot;node&quot; x=&quot;25&quot; y=&quot;95&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;110&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;User hovers/focuses&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;110&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;producer starts activation&lt;/text&gt;
          &lt;path class=&quot;edge&quot; marker-end=&quot;url(#arrow-intent)&quot; d=&quot;M195 135 H280&quot; /&gt;
          &lt;rect class=&quot;selected&quot; x=&quot;280&quot; y=&quot;95&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;365&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;Card prepares Live&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;365&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;pin + rich control path&lt;/text&gt;
          &lt;path class=&quot;edge&quot; marker-end=&quot;url(#arrow-intent)&quot; d=&quot;M450 135 H535&quot; /&gt;
          &lt;rect class=&quot;node&quot; x=&quot;535&quot; y=&quot;95&quot; width=&quot;150&quot; height=&quot;80&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;610&quot; y=&quot;125&quot; text-anchor=&quot;middle&quot;&gt;First click&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;610&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;one physical intent&lt;/text&gt;
          &lt;path class=&quot;edge&quot; marker-end=&quot;url(#arrow-intent)&quot; d=&quot;M685 120 C730 95 745 65 785 65&quot; /&gt;
          &lt;path class=&quot;edge&quot; marker-end=&quot;url(#arrow-intent)&quot; d=&quot;M685 150 C730 175 745 220 785 220&quot; /&gt;
          &lt;rect class=&quot;decision-node&quot; x=&quot;785&quot; y=&quot;25&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;880&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Live ready&lt;/text&gt;
          &lt;text x=&quot;880&quot; y=&quot;79&quot; text-anchor=&quot;middle&quot;&gt;control handles once&lt;/text&gt;
          &lt;rect class=&quot;warning-node&quot; x=&quot;785&quot; y=&quot;180&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;880&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Race lost&lt;/text&gt;
          &lt;text x=&quot;880&quot; y=&quot;234&quot; text-anchor=&quot;middle&quot;&gt;queue/equivalent once&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/div&gt;
      &lt;p&gt;
        Cached pixels were rejected partly because a synthetic replay cannot recreate every browser-trusted
        event—for example modified links, popup activation, file controls, or certain media controls.
      &lt;/p&gt;
    &lt;/article&gt;

    &lt;article id=&quot;image-economics&quot; data-annotatable data-anchor-label=&quot;Image cost model&quot;&gt;
      &lt;h3&gt;2.5 Image performance is five different costs&lt;/h3&gt;
      &lt;div class=&quot;diagram&quot;&gt;
        &lt;svg viewBox=&quot;0 0 1100 210&quot; role=&quot;img&quot; aria-labelledby=&quot;image-title image-desc&quot;&gt;
          &lt;title id=&quot;image-title&quot;&gt;Image performance cost stack&lt;/title&gt;
          &lt;desc id=&quot;image-desc&quot;&gt;Stored bytes, decoded pixels, renditions, paint work, and cache growth are separate costs.&lt;/desc&gt;
          &lt;rect class=&quot;node&quot; x=&quot;10&quot; y=&quot;55&quot; width=&quot;195&quot; height=&quot;95&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;108&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;1 · Stored bytes&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;108&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;compressed master reference&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;108&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;disk / Board JSON cost&lt;/text&gt;
          &lt;rect class=&quot;selected&quot; x=&quot;230&quot; y=&quot;55&quot; width=&quot;195&quot; height=&quot;95&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;328&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;2 · Decoded pixels&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;328&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;expanded memory surface&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;328&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;not bounded by file size&lt;/text&gt;
          &lt;rect class=&quot;decision-node&quot; x=&quot;450&quot; y=&quot;55&quot; width=&quot;195&quot; height=&quot;95&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;548&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;3 · Renditions&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;548&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;thumbnail / Card / gallery&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;548&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;disposable display copies&lt;/text&gt;
          &lt;rect class=&quot;node&quot; x=&quot;670&quot; y=&quot;55&quot; width=&quot;195&quot; height=&quot;95&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;768&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;4 · Paint/upload&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;768&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;browser/compositor work&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;768&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;device-dependent&lt;/text&gt;
          &lt;rect class=&quot;node&quot; x=&quot;890&quot; y=&quot;55&quot; width=&quot;195&quot; height=&quot;95&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;988&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;5 · Cache growth&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;988&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;residency + eviction&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;988&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;repeated traversal&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/div&gt;
      &lt;p&gt;
        The baseline stored only &lt;strong&gt;2,375 bytes&lt;/strong&gt; of fixture image data, yet its
        source-dimension decoded-pixel estimate was &lt;strong&gt;48.66 MiB&lt;/strong&gt;. That contrast is why compressed
        file size cannot stand in for runtime image memory.
      &lt;/p&gt;
      &lt;p&gt;
        The selected policy keeps one authoritative saved reference and creates bounded purpose/size renditions
        in memory. Export and AI receive an authoritative suitable reference—never a thumbnail or temporary
        &lt;code&gt;blob:&lt;/code&gt; URL. Full content-addressed blob storage remains separate
        &lt;a href=&quot;https://github.com/limweili/eido/issues/461&quot;&gt;#461&lt;/a&gt;.
      &lt;/p&gt;
    &lt;/article&gt;

    &lt;article id=&quot;evidence-language&quot; data-annotatable data-anchor-label=&quot;How to read the evidence&quot;&gt;
      &lt;h3&gt;2.6 How to read claims in this report&lt;/h3&gt;
      &lt;div class=&quot;four-quadrants&quot;&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;MEASURED&lt;/h4&gt;
          &lt;p&gt;Directly observed or deterministically calculated in the synthetic lane, with stated provenance.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;DECISION&lt;/h4&gt;
          &lt;p&gt;A product/architecture conclusion drawn from the complete evidence—not itself a raw measurement.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;LIMITATION&lt;/h4&gt;
          &lt;p&gt;Explicitly not established. It remains a gate or tracked question rather than being encoded as zero.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;PLANNED&lt;/h4&gt;
          &lt;p&gt;Agent-ready tracker work. It is not implemented merely because the issue graph exists.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;callout warning&quot;&gt;
        Timing on the managed Mac is directional context, not an absolute device promise. Structural counters,
        public behavior, exact CI, and independent Standards/Spec review carry more authority here.
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article id=&quot;founder-questions&quot; data-annotatable data-anchor-label=&quot;Founder review questions&quot;&gt;
      &lt;h3&gt;2.7 Questions worth answering before a production kickoff&lt;/h3&gt;
      &lt;ol class=&quot;compact-list&quot;&gt;
        &lt;li&gt;Is it clear and acceptable that “epic complete” means decision-ready, not product-speedup shipped?&lt;/li&gt;
        &lt;li&gt;Is the rare far-jump lightweight fallback acceptable so bounded memory wins over pre-rendering everything?&lt;/li&gt;
        &lt;li&gt;Should exactly-once first intent remain a hard gate even if it rules out otherwise fast passive renderers?&lt;/li&gt;
        &lt;li&gt;Should Find/copy/keyboard/accessibility equivalence remain default-on blockers?&lt;/li&gt;
        &lt;li&gt;Is eager &lt;code&gt;SavedBoard&lt;/code&gt; correct until a real record-resolver seam and representative benefit exist?&lt;/li&gt;
        &lt;li&gt;Are the provisional 8 MiB decoded / 2 MiB derived fixture gates understood as starting evidence, not universal budgets?&lt;/li&gt;
        &lt;li&gt;Does S0–S8 divide future work at the right user-visible boundaries?&lt;/li&gt;
        &lt;li&gt;When should rejected prototype flags/code be removed after their evidence value is exhausted?&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;section id=&quot;area-retro&quot; data-annotatable data-anchor-label=&quot;Area 3 — Retro and collaboration review&quot;&gt;
    &lt;h2&gt;Area 3 — Ongoing retro, final retro, and how we work better together&lt;/h2&gt;
    &lt;p class=&quot;area-intro&quot;&gt;
      The candid conclusion: the epic landed safely and made several important discoveries, but the route was
      materially slower than necessary. The main bottleneck was an evidence strategy that became a second
      product—not the Required CI pipeline.
    &lt;/p&gt;
    &lt;div class=&quot;summary-grid&quot; aria-label=&quot;Retro summary&quot;&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Principal bottleneck&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot;&gt;Evidence overgrowth&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;~14,000 lines and 205 cases accumulated around #405.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Most effective correction&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot;&gt;205 → 23 tests&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;Representative public-seam proof replaced CPU-heavy repetition.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Future operating rule&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot;&gt;Decision-led evidence&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;Stop collecting proof once it no longer changes the decision.&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;article id=&quot;retro-verdict&quot; data-annotatable data-anchor-label=&quot;Retro executive verdict&quot;&gt;
      &lt;h3&gt;3.1 Executive verdict&lt;/h3&gt;
      &lt;div class=&quot;callout decision&quot;&gt;
        &lt;strong&gt;Your assessment was directionally correct.&lt;/strong&gt; CPU/load/browser measurements on this Mac
        were not authoritative; proof was repeated in the wrong places; tests grew faster than confidence; and
        evidence should have been reused across shared primitives and wider behavior slices.
      &lt;/div&gt;
      &lt;p&gt;
        The exact statement that the epic should have taken “half the time” cannot be proved. Some work found
        genuine product blockers that must not be dismissed: first-click retargeting, incomplete search/copy
        semantics, image-readiness ambiguity, stale passive roots, scroll drift, and accessibility limitations.
        What is provable is that most of the late #405 evidence system was removable, and convergence accelerated
        sharply after it was removed.
      &lt;/p&gt;
    &lt;/article&gt;

    &lt;article id=&quot;retro-numbers&quot; data-annotatable data-anchor-label=&quot;Retro quantitative evidence&quot;&gt;

          &lt;tbody&gt;
            &lt;tr&gt;&lt;td data-label=&quot;Indicator&quot;&gt;Forensic retro&lt;/td&gt;&lt;td data-label=&quot;Observed&quot;&gt;3,626 lines · 412 H3 headings · 384 date-stamped entries&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Excellent provenance; poor operating skimmability.&lt;/td&gt;&lt;/tr&gt;

    &lt;/article&gt;

    &lt;article id=&quot;evidence-loop&quot; data-annotatable data-anchor-label=&quot;Evidence overengineering loop&quot;&gt;
      &lt;h3&gt;3.3 The avoidable loop and the unblock&lt;/h3&gt;

          &lt;rect class=&quot;decision-node&quot; x=&quot;75&quot; y=&quot;245&quot; width=&quot;250&quot; height=&quot;90&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;200&quot; y=&quot;277&quot; text-anchor=&quot;middle&quot;&gt;Owner intervention&lt;/text&gt;
          &lt;text x=&quot;200&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot;&gt;Evidence must change decision&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;200&quot; y=&quot;321&quot; text-anchor=&quot;middle&quot;&gt;CPU timing is non-authoritative&lt;/text&gt;
          &lt;path class=&quot;edge&quot; marker-end=&quot;url(#arrow-loop)&quot; d=&quot;M325 290 H410&quot; /&gt;
          &lt;rect class=&quot;selected&quot; x=&quot;410&quot; y=&quot;245&quot; width=&quot;250&quot; height=&quot;90&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;535&quot; y=&quot;277&quot; text-anchor=&quot;middle&quot;&gt;Remove blocking harness&lt;/text&gt;
          &lt;text x=&quot;535&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot;&gt;Reuse shared seam proof&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;535&quot; y=&quot;321&quot; text-anchor=&quot;middle&quot;&gt;23 representative cases&lt;/text&gt;
          &lt;path class=&quot;edge&quot; marker-end=&quot;url(#arrow-loop)&quot; d=&quot;M660 290 H745&quot; /&gt;
          &lt;rect class=&quot;decision-node&quot; x=&quot;745&quot; y=&quot;245&quot; width=&quot;250&quot; height=&quot;90&quot; rx=&quot;12&quot; /&gt;
          &lt;text x=&quot;870&quot; y=&quot;277&quot; text-anchor=&quot;middle&quot;&gt;Standards + Spec review&lt;/text&gt;
          &lt;text x=&quot;870&quot; y=&quot;300&quot; text-anchor=&quot;middle&quot;&gt;One Required gate&lt;/text&gt;
          &lt;text class=&quot;muted-text&quot; x=&quot;870&quot; y=&quot;321&quot; text-anchor=&quot;middle&quot;&gt;#406–#409 converge&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/div&gt;
      &lt;p&gt;
        The Mac made timing evidence unreliable, but the larger delay came from repeatedly accommodating a
        non-authoritative evidence source instead of changing method.
      &lt;/p&gt;
    &lt;/article&gt;

    &lt;article id=&quot;ci-retro&quot; data-annotatable data-anchor-label=&quot;Was CI blocking?&quot;&gt;
      &lt;h3&gt;3.4 Was the new CI process blocking the epic?&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;No—not in the primary sense.&lt;/strong&gt;&lt;/p&gt;
      &lt;p&gt;
        Required CI was generally fast and had no meaningful queue bottleneck. Candidate/provider workflows and
        the local CPU/browser environment caused most repeated failures. The new CI process did create necessary
        migration work: rebases, exact toolchain adoption, stale-check replacement, workflow reclassification,
        and refreshed exact-head identity.
      &lt;/p&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Necessary disruption&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;PR #415 established one canonical Required command and release artifact.&lt;/li&gt;
            &lt;li&gt;Node 22/npm 10 exactness prevented lockfile/toolchain drift.&lt;/li&gt;
            &lt;li&gt;PR #541 made delivery roles system-agnostic.&lt;/li&gt;
            &lt;li&gt;PR #542 made proof risk-led and optional canaries explicitly non-blocking.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;What finally worked&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;One broad Required proof on a stable head.&lt;/li&gt;
            &lt;li&gt;Exact-main proof and release artifact after each merge.&lt;/li&gt;
            &lt;li&gt;Mechanical rebase → patch identity → only invalidated checks.&lt;/li&gt;
            &lt;li&gt;Relevant red canaries investigated without becoming accidental gates.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article id=&quot;owner-interventions&quot; data-annotatable data-anchor-label=&quot;Review of owner interventions&quot;&gt;
      &lt;h3&gt;3.5 How your interventions changed the outcome&lt;/h3&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;
        &lt;table aria-label=&quot;Owner intervention review&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Intervention&lt;/th&gt;&lt;th&gt;Actual effect&lt;/th&gt;&lt;th&gt;How to make it even better next time&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Aggressively trim CPU-heavy tests and remove benchmark harness&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;&lt;strong&gt;Highest leverage and correct.&lt;/strong&gt; Broke the self-reinforcing evidence loop; 205 cases became 23; architecture stopped depending on host cleanliness.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Make this a kickoff stop rule—or trigger it after the second environment-sensitive failure—so you never have to notice it after two days.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Call out Mac/Chromium bottleneck; offer gaming PC&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;Diagnosis was directionally correct. Spare PC was useful optional capacity, but relocating a low-value benchmark would not make it necessary.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Activate spare hardware only when a specific unresolved product decision needs authoritative controlled timing.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Require proportional cross-slice testing&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;Correct and now institutionalized: prove shared primitives once, test distinct consumer behavior, compose wider journeys, run Required once.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Ask for the epic claim-to-proof map at kickoff and review it before implementation fans out.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Rewrite the goal around why; make Multy optional&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;&lt;strong&gt;Decisive.&lt;/strong&gt; Preserved destination while allowing stale mechanics/topology to be replaced.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Begin with the why-led charter; keep changing methods in live policy/plan, not the durable goal.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Require rebases for PR #415/#541/#542 and Node changes&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;Necessary for correctness, but disruptive in aggregate because exact-head identity repeatedly changed.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Say “adopt at the next stable integration boundary; prove patch identity; rerun only invalidated gates” unless security/storage/public semantics demand immediate cutover.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Prohibit Fable 5&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;Constraint was safely enforced. One pre-prohibition partial review was discarded; no Fable output was accepted and none was invoked afterward.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Declare quota/model exclusions at kickoff. The agent must carry them through every compaction and review brief.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Require incremental retro logging&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;Created unusually strong forensic provenance and made the self-load diagnosis discoverable.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Use two levels: high-signal rolling synthesis + append-only event ledger. Group micro-shell/tool incidents.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Ask repeatedly for status and percentage&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;Exposed an observability/trust gap, but percentages were unstable while the denominator expanded.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Ask: “What outcome changed, what is the single constraint, what did you stop doing, and what evidence closes the next gate?” The orchestrator should volunteer this.&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td data-label=&quot;Intervention&quot;&gt;Increase model limits / Sol capacity&lt;/td&gt;
              &lt;td data-label=&quot;Effect&quot;&gt;Helped hard review and diagnosis, but could not fix decision discipline. Tokens were not the central bottleneck.&lt;/td&gt;
              &lt;td data-label=&quot;Next time&quot;&gt;Scale reasoning only after lane boundaries, evidence stop conditions, and shared-state ownership are sound.&lt;/td&gt;
            &lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article id=&quot;agent-accountability&quot; data-annotatable data-anchor-label=&quot;What agents should improve&quot;&gt;
      &lt;h3&gt;3.6 What the orchestrator and agents should have done better&lt;/h3&gt;
      &lt;ol class=&quot;compact-list&quot;&gt;
        &lt;li&gt;&lt;strong&gt;Define a claim-to-proof map first.&lt;/strong&gt; One user outcome, authoritative seam, reusable proof, invalidation rule, and stop condition per material risk.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Treat candidate rejection as success.&lt;/strong&gt; Once a correctness veto is decisive, ask whether more harness work can change eligibility.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Stop repeated non-informative failures.&lt;/strong&gt; Change method after the same environmental boundary repeats without new information.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Keep provider workflows provider-specific.&lt;/strong&gt; Do not run 339 broad cases immediately before a cleanliness sample.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Bootstrap worktrees mechanically.&lt;/strong&gt; Exact Node/npm, dependencies, writable cache, lock parity, index state, and graph readiness before interpreting RED.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Replace silent workers early.&lt;/strong&gt; No file, tool call, or verdict means authority should move.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Enforce review gates structurally.&lt;/strong&gt; Do not rely on prose checkpoints inside compound push commands.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Review meaningful stable boundaries.&lt;/strong&gt; Do not recursively re-review mechanically identical lineage.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Keep one writer per shared artifact.&lt;/strong&gt; Shared ownership must be acknowledged before mutation.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Read current policy from current main.&lt;/strong&gt; Handoffs carry pointers, never current truth.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Report the real blocker early.&lt;/strong&gt; The candid message should have been: “Required CI is not blocking; the provider harness no longer changes the decision, so I am deleting it.”&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Compress process memory continuously.&lt;/strong&gt; Protecting implementation context is insufficient if the retro becomes another unwieldy product.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/article&gt;

    &lt;article id=&quot;retro-review&quot; data-annotatable data-anchor-label=&quot;Review of the live and final retro&quot;&gt;
      &lt;h3&gt;3.7 Review of the ongoing and final retro&lt;/h3&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;What it did exceptionally well&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;Preserved chronology instead of rewriting the story cleaner.&lt;/li&gt;
            &lt;li&gt;Recorded symptoms, evidence, impact, root cause, unblock, prevention, and status.&lt;/li&gt;
            &lt;li&gt;Included exact runs, SHAs, artifacts, digests, and tracker links.&lt;/li&gt;
            &lt;li&gt;Distinguished setup failure, red evidence, absent proof, and accepted proof.&lt;/li&gt;
            &lt;li&gt;Recorded corrections when earlier diagnoses were wrong.&lt;/li&gt;
            &lt;li&gt;Preserved privacy, model-routing, and user-work safety.&lt;/li&gt;
            &lt;li&gt;Finished with an accurate final synthesis.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Where the retro itself created friction&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;3,626 lines and 412 H3 headings are not skimmable.&lt;/li&gt;
            &lt;li&gt;Repeated safety disclaimers obscure unique information.&lt;/li&gt;
            &lt;li&gt;Append-only snapshots can contradict later truth without a supersession index.&lt;/li&gt;
            &lt;li&gt;No direct before/after table or owner-intervention assessment.&lt;/li&gt;
            &lt;li&gt;Necessary product discovery and avoidable process work receive similar visual weight.&lt;/li&gt;
            &lt;li&gt;Micro shell/tool incidents often get the same seven-field treatment as architecture vetoes.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;callout warning&quot;&gt;
        &lt;strong&gt;Example of append-only supersession:&lt;/strong&gt; an early checkpoint said Fable was never used.
        The later authoritative truth is that one partial pre-prohibition invocation occurred, was discarded,
        no output was accepted, and no Fable review was invoked after the prohibition.
      &lt;/div&gt;
      &lt;h4&gt;Recommended future retro format&lt;/h4&gt;
      &lt;ol class=&quot;compact-list&quot;&gt;
        &lt;li&gt;&lt;strong&gt;Current synthesis (1–2 pages):&lt;/strong&gt; outcome, timeline, top friction, before/after, owner/agent lessons, unresolved risks.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Decision/correction index:&lt;/strong&gt; original belief, correcting evidence, final truth, affected entries.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Collapsible forensic ledger:&lt;/strong&gt; only incidents that invalidate evidence, change the plan, recur, cross a safety boundary, or cost material time.&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/article&gt;

    &lt;article id=&quot;keep-stop-start-change&quot; data-annotatable data-anchor-label=&quot;Keep Stop Start Change&quot;&gt;
      &lt;h3&gt;3.8 Keep / Stop / Start / Change&lt;/h3&gt;
      &lt;div class=&quot;four-quadrants&quot;&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Keep&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;Product truths as architecture gates.&lt;/li&gt;
            &lt;li&gt;Synthetic privacy-safe fixtures.&lt;/li&gt;
            &lt;li&gt;Independent Standards + Spec review.&lt;/li&gt;
            &lt;li&gt;Exact-head Required + exact-main artifact.&lt;/li&gt;
            &lt;li&gt;Honest &lt;code&gt;not-measured&lt;/code&gt; limitations.&lt;/li&gt;
            &lt;li&gt;Serial consequential merges and preserve-first cleanup.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Stop&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;Local CPU/FPS/load as authoritative.&lt;/li&gt;
            &lt;li&gt;Provider reruns without a new discriminator.&lt;/li&gt;
            &lt;li&gt;Field-by-field evidence expansion after decision value ends.&lt;/li&gt;
            &lt;li&gt;Repeating broad gates in every role.&lt;/li&gt;
            &lt;li&gt;Static registries/handoffs as live authority.&lt;/li&gt;
            &lt;li&gt;Silent workers holding ownership.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Start&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;One epic claim-to-proof map.&lt;/li&gt;
            &lt;li&gt;Evidence budget and stop condition per lane.&lt;/li&gt;
            &lt;li&gt;Mechanical worktree bootstrap.&lt;/li&gt;
            &lt;li&gt;Skeleton-first documents/tracker graphs.&lt;/li&gt;
            &lt;li&gt;One active writer per shared surface.&lt;/li&gt;
            &lt;li&gt;A “what did we stop doing?” checkpoint.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;plain-group&quot;&gt;
          &lt;h4&gt;Change&lt;/h4&gt;
          &lt;ul class=&quot;compact-list&quot;&gt;
            &lt;li&gt;Review every small delta → review stable boundaries.&lt;/li&gt;
            &lt;li&gt;Full revalidation → patch lineage + invalidated checks.&lt;/li&gt;
            &lt;li&gt;Status activity lists → outcome, constraint, next proof.&lt;/li&gt;
            &lt;li&gt;One huge retro → rolling synthesis + forensic ledger.&lt;/li&gt;
            &lt;li&gt;Fixed agent topology → available capability and risk.&lt;/li&gt;
            &lt;li&gt;Populate every metric → answer one material decision.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/article&gt;

      &lt;div class=&quot;callout decision&quot;&gt;
        Preserve product truths rigorously, but require every test, benchmark, workflow, and review to identify
        which unresolved decision it changes. When it cannot, stop maintaining it and move the epic forward.

        &lt;div class=&quot;plain-group&quot;&gt;

            &lt;li&gt;Early deletion or reslicing of non-informative evidence work.&lt;/li&gt;
            &lt;li&gt;Explicit distinction between capability, capacity, evidence, and product failures.&lt;/li&gt;
            &lt;li&gt;A compact rolling synthesis so you never need to reconstruct the blocker.&lt;/li&gt;
            &lt;li&gt;Owner escalation only for product, safety, cost, or irreversible choices.&lt;/li&gt;
