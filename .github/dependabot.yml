version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      npm-patch-and-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']
      react-ecosystem-major:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
